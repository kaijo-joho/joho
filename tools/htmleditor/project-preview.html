<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline' blob:; img-src blob: data:; frame-src 'self' about:; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>作品プレビュー</title>
  <style>
    body { margin: 0; height: 100vh; height: 100dvh; display: grid; grid-template-rows: auto auto minmax(0, 1fr); background: #fff; font: 1rem/1.5 system-ui, sans-serif; }
    header { display: flex; flex-wrap: wrap; align-items: baseline; gap: .25rem 1rem; padding: .55rem 1rem; background: #0c4c83; color: #fff; overflow-wrap: anywhere; }
    header span { color: #e0efff; font-size: .9rem; }
    #projectPreviewNotice { grid-row: 2; margin: 0; padding: .55rem 1rem; background: #f1f5f9; color: #24384a; overflow-wrap: anywhere; }
    main { grid-row: 3; min-height: 0; }
    iframe { display: block; width: 100%; height: 100%; border: 0; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <header aria-label="作品プレビュー">
    <strong>作品プレビュー</strong>
    <span id="projectPreviewFile"></span>
    <span id="projectPreviewUnsaved" hidden>未保存の編集を含みます</span>
  </header>
  <p id="projectPreviewNotice" role="status">作品を読み込んでいます。</p>
  <main>
    <iframe id="projectPreviewFrame" title="作品の表示" sandbox="allow-same-origin allow-popups allow-popups-to-escape-sandbox"></iframe>
  </main>
  <noscript><p>作品プレビューにはJavaScriptが必要です。</p></noscript>
  <script src="filesystem.js?v=html-editor-project-preview-r1" defer integrity="sha384-+FXBxKAGxZMpyvuVhdGwSQGnI+AbKgONJlySeAVR/7I7mjpqWCAYTJZj5yNpFxUO" crossorigin="anonymous"></script>
  <script src="diagnostics.js?v=html-editor-project-preview-r1" defer integrity="sha384-ArVXRo/o4B+2o0hz+bvR5rrrSaHmmMwrKhoVZp37OVlfV/7RBl6fOrmaSIP8oTWC" crossorigin="anonymous"></script>
  <script src="preview.js?v=html-editor-project-preview-r1" defer integrity="sha384-73cdlLf5iQd6OQZgAbp3K8oLzrKzSqQVQA14KvWzQtid7ongFyrYuMhczLgRO5zL" crossorigin="anonymous"></script>
  <script src="project-preview.js?v=html-editor-project-preview-r1" defer integrity="sha384-k/AmJh3EMh6g/acXPfGOug0uX0dGUzfl3jA5LEpD/E/hrIMXpthwFBSsPNkxjQn6" crossorigin="anonymous"></script>
</body>
</html>
