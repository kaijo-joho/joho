<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>イラストスライド illustSlideへ移動</title>
  <link rel="icon" href="../illustslide/icon.svg" type="image/svg+xml">
  <script src="../illustslide/core.js" defer></script>
  <script src="../illustslide/legacy-redirect.js" defer></script>
  <style>
    :root{color-scheme:light dark;font:16px/1.8 -apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif}
    :root[data-theme="light"]{color-scheme:light}:root[data-theme="dark"]{color-scheme:dark}
    body{max-width:640px;margin:48px auto;padding:0 20px}h1{font-size:1.4rem}h2{font-size:1.15rem}a{color:LinkText}
    a,button{max-width:100%;overflow-wrap:anywhere}#destination{display:inline-block;min-height:44px}
    button{display:block;min-height:44px;margin:10px 0;padding:8px 14px;font:inherit;cursor:pointer}
    :focus-visible{outline:3px solid #3684c1;outline-offset:3px}[hidden]{display:none}
  </style>
</head>
<body>
  <h1>イラストスライド illustSlideへ移動しました</h1>
  <p><a href="../illustslide/index.html" id="destination">イラストスライド illustSlideを開く</a></p>
  <section id="old-storage" hidden>
    <h2>以前の場所で保存した作品</h2>
    <p>ファイルを直接開いて使っていた場合は、次の内容を保存してから、新しいエディタの「開く → ファイルを開く」で読み込めます。</p>
    <div id="saved-files"></div>
  </section>
  <p id="message" role="status"></p>
</body>
</html>
