<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 800 800" role="img" aria-labelledby="title desc">
  <title id="title">山の上に浮かぶ気球</title>
  <desc id="desc">青い空と緑の山を背景に、赤、黄色、青の帯がある気球が浮かんでいます。空や気球のなめらかな濃淡と、輪郭の細かさを比べるための見本です。</desc>
  <defs>
