    <linearGradient id="red" x2="1" y2="1"><stop stop-color="#ffd29a"/><stop offset=".3" stop-color="#f46537"/><stop offset="1" stop-color="#962d55"/></linearGradient>
    <linearGradient id="yellow" x2="1" y2="1"><stop stop-color="#fff6b1"/><stop offset=".5" stop-color="#f8c955"/><stop offset="1" stop-color="#ef772d"/></linearGradient>
    <linearGradient id="blue" x2="1" y2="1"><stop stop-color="#b1e4ef"/><stop offset=".45" stop-color="#398dbe"/><stop offset="1" stop-color="#283877"/></linearGradient>
    <linearGradient id="near" x2="0" y2="1"><stop stop-color="#2d865f"/><stop offset="1" stop-color="#114e50"/></linearGradient>
    <clipPath id="envelope"><path d="M204 244 C204 59 586 59 586 244 C586 347 490 425 460 465 H330 C300 425 204 347 204 244Z"/></clipPath>
  </defs>
