<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>本人用HTML連携テスト</title>
  <style>
    body { max-width: 40rem; margin: 2rem auto; padding: 0 1rem; font-family: sans-serif; line-height: 1.8; }
    h1 { color: #00548a; }
    .message { border-left: 4px solid #00548a; padding: 0.5rem 1rem; background: #edf6fc; }
  </style>
</head>
<body>
  <h1>本人用HTML連携テスト</h1>
  <p>これは教員による動作確認用のファイルです。通常の実習課題ではありません。</p>
  <p class="message">この文章を自分で変更し、ファイル名を変えずに保存してください。</p>
  <p><a href="#check">保存・提出の確認へ</a></p>
  <h2 id="check">保存・提出の確認</h2>
  <ul>
    <li>本文を変更して保存する。</li>
    <li>ブラウザで開き直し、変更が残っていることを確認する。</li>
    <li>試験用の提出フォームで、このHTMLと画面の画像を選択する。</li>
  </ul>
</body>
</html>
