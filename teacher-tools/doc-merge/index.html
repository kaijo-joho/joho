<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <meta name="color-scheme" content="light dark">
  <title>差し込み文書メーカー｜教員用</title>
  <style>
    :root {
      color-scheme: light dark;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
      line-height: 1.7;
      background: #f4f6f8;
      color: #17212b;
    }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 24px 16px; min-height: 100vh; }
    main {
      width: min(100%, 620px);
      margin: 8vh auto 0;
      padding: clamp(22px, 6vw, 40px);
      border: 1px solid #d4dce4;
      border-radius: 16px;
      background: #fff;
      box-shadow: 0 8px 28px rgb(23 33 43 / 8%);
    }
    h1 { margin: 0 0 12px; font-size: clamp(1.45rem, 5vw, 2rem); line-height: 1.35; }
    p { margin: 0 0 12px; }
    .access-note { color: #435466; font-size: .95rem; }
    .open-link {
      display: flex;
      min-height: 48px;
      align-items: center;
      justify-content: center;
      margin-top: 24px;
      padding: 10px 18px;
      border-radius: 8px;
      background: #1558a6;
      color: #fff;
      font-weight: 700;
      text-align: center;
      text-decoration: none;
    }
    .open-link:hover { background: #0e4587; }
    .open-link:focus-visible { outline: 3px solid #efaa24; outline-offset: 3px; }
    @media (prefers-color-scheme: dark) {
      :root { background: #111820; color: #edf2f7; }
      main { border-color: #3b4855; background: #1c2732; box-shadow: 0 8px 28px rgb(0 0 0 / 22%); }
      .access-note { color: #bdc9d5; }
      .open-link { background: #82b8ff; color: #10243a; }
      .open-link:hover { background: #a2cbff; }
    }
  </style>
</head>
<body>
  <main>
    <h1>差し込み文書メーカー</h1>
    <p>表データから1人1ページの文書PDFを作成・保存できます。</p>
    <p class="access-note">現在は作成者本人のGoogleアカウントのみ利用できます。</p>
    <a class="open-link" href="https://script.google.com/a/macros/gfe.kaijo.ed.jp/s/AKfycbxTrUO9ejXnwwomSQZL7SRfPszYyEtw2yoWyvick7-c-iD71e8muKs5UIDW4QTB6Xs-/exec" target="_blank" rel="noopener noreferrer">差し込み文書メーカーを開く</a>
  </main>
</body>
</html>
